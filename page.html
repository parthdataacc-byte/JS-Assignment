<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management System</title>
</head>
<body>
    <h2>User Management System</h2>

    <input type="text" id="name" placeholder="enter name" /><br/><br/>
    <input type="email" id="email" placeholder="enter email" /><br/><br/>
    <select id="role">
        <option value="admin">Admin</option>
        <option value="user">User</option>
        <option value="guest">Guest</option>
    </select>

    <button onclick="createUser()">Add User</button>
    <button onclick="displayUsers()">Display All</button>
    <button onclick="showActiveUsers()">Show Active</button>
    <button onclick="filterUsers('admin')">Admins</button>
    <button onclick="filterUsers('user')">Users</button>
    <button onclick="filterUsers('guest')">Guests</button>

    <h3>Users List</h3>
    <div id="userList"></div>

    <script src="logic.js"></script>
</body>
</html>
